name: CI

on:
  # push and pull_request intentionally list the same paths (see #24): a PR
  # touching only a path missing from pull_request's list runs zero CI, then
  # merging runs the full pipeline unverified on the first real attempt.
  # docker/** and root scripts/** are deliberately NOT included -- verified
  # neither is referenced by this workflow or the Dockerfile (they belong to
  # docker-compose / the local Lucille ingest scripts instead).
  push:
    branches: [main, develop]
    paths:
      - 'langchain_agent/**'
      - '.github/workflows/build-deploy.yml'
      - 'docker-compose.yml'
      - '.dockerignore'
  pull_request:
    branches: [main, develop]
    paths:
      - 'langchain_agent/**'
      - '.github/workflows/build-deploy.yml'
      - 'docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel stale PR runs when a new push lands on the same branch — saves CI
# minutes on rapid-fire pushes. Main-branch runs are NEVER cancelled so a
# push to main always finishes its full check run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Phase 1 - Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Shared with integration-tests (see #24 -- was 32 byte-identical
      # duplicated lines across the two jobs). Also where the pip-cache
      # collision comment lived: unit-tests and integration-tests
      # intentionally share one cache-dependency-path (identical installs),
      # distinct from lint-backend's much smaller toolchain.
      - uses: ./.github/actions/setup-python-test-env

      - name: Run Phase 1 Unit Tests
        run: |
          cd langchain_agent
          PYTHONPATH=. pytest tests/unit/ \
            -v \
            -ra \
            -n auto \
            --tb=short \
            --timeout=30 \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing:skip-covered \
            --junit-xml=test-results-phase1.xml

      - name: Generate unit test summary
        if: always()
        run: |
          cd langchain_agent
          TESTS="?" PASSED="?" FAILURES="0" ERRORS="0" SKIPPED="?" STATUS="⚠️ No results" COVERAGE="?"
          if [ -f test-results-phase1.xml ]; then
            read -r TESTS FAILURES ERRORS SKIPPED < <(python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('test-results-phase1.xml').getroot(); suites=root.findall('testsuite') if root.tag=='testsuites' else [root]; print(sum(int(s.get('tests',0))for s in suites),sum(int(s.get('failures',0))for s in suites),sum(int(s.get('errors',0))for s in suites),sum(int(s.get('skipped',0))for s in suites))")
            PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
            if [ "${FAILURES}" -gt 0 ] || [ "${ERRORS}" -gt 0 ]; then
              STATUS="❌ Failed"
            else
              STATUS="✅ Passed"
            fi
          fi
          if [ -f coverage.xml ]; then
            COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('coverage.xml').getroot(); print(f\"{float(r.get('line-rate',0))*100:.1f}\")")
          fi
          {
            echo "## Phase 1 — Unit Test Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $STATUS |"
            echo "| Total tests | $TESTS |"
            echo "| Passed | $PASSED |"
            echo "| Failed | $FAILURES |"
            echo "| Errors | $ERRORS |"
            echo "| Skipped | $SKIPPED |"
            echo "| Line coverage | ${COVERAGE}% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase 1 Coverage Report
        # push only (see #24): a 30-day HTML coverage artifact on every PR
        # run is rarely opened and wastes upload time + storage. The XML
        # report (parsed above for the step summary) is generated either way.
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-phase1
          path: langchain_agent/htmlcov/
          retention-days: 30

      - name: Upload Phase 1 Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-phase1
          path: langchain_agent/test-results-phase1.xml
          retention-days: 30

  integration-tests:
    name: Phase 2 - Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agentic_hybrid_search_test
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432

      opensearch:
        image: opensearchproject/opensearch:3.8.0
        env:
          discovery.type: single-node
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: TestPassword123!
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
          DISABLE_SECURITY_PLUGIN: "true"
        options: >-
          --health-cmd "curl -s http://localhost:9200 > /dev/null || exit 1"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 30
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v6

      # Shared with unit-tests (see #24 -- was 32 byte-identical duplicated
      # lines across the two jobs).
      - uses: ./.github/actions/setup-python-test-env

      - name: Verify Services
        run: |
          echo "Checking PostgreSQL..."
          pg_isready -h localhost -p 5432 -U test
          echo "PostgreSQL ready!"

          echo "Checking OpenSearch..."
          curl -s http://localhost:9200 | head -c 50
          echo ""
          echo "OpenSearch ready!"

      - name: Create empty OpenSearch index
        run: |
          cd langchain_agent
          # Index + search pipeline only -- no Postgres, no real product data,
          # no Google API validation. Several integration tests
          # (enrichment_service.py) only need the index to exist with the
          # right mapping, not to contain real documents -- they mock the
          # actual Lucille subprocess.
          python setup.py --skip-db --skip-docs --skip-models

      - name: Run Phase 2 Integration Tests
        run: |
          cd langchain_agent
          PYTHONPATH=. pytest tests/integration/ \
            -v \
            -ra \
            -m "not slow" \
            --tb=short \
            --timeout=60 \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junit-xml=test-results-phase2.xml

      - name: Generate integration test summary
        if: always()
        run: |
          cd langchain_agent
          TESTS="?" PASSED="?" FAILURES="0" ERRORS="0" SKIPPED="?" STATUS="⚠️ No results"
          if [ -f test-results-phase2.xml ]; then
            read -r TESTS FAILURES ERRORS SKIPPED < <(python3 -c "import xml.etree.ElementTree as ET; root=ET.parse('test-results-phase2.xml').getroot(); suites=root.findall('testsuite') if root.tag=='testsuites' else [root]; print(sum(int(s.get('tests',0))for s in suites),sum(int(s.get('failures',0))for s in suites),sum(int(s.get('errors',0))for s in suites),sum(int(s.get('skipped',0))for s in suites))")
            PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
            if [ "${FAILURES}" -gt 0 ] || [ "${ERRORS}" -gt 0 ]; then
              STATUS="❌ Failed"
            else
              STATUS="✅ Passed"
            fi
          fi
          {
            echo "## Phase 2 — Integration Test Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Status | $STATUS |"
            echo "| Total tests | $TESTS |"
            echo "| Passed | $PASSED |"
            echo "| Failed | $FAILURES |"
            echo "| Errors | $ERRORS |"
            echo "| Skipped | $SKIPPED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase 2 Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-phase2
          path: langchain_agent/test-results-phase2.xml
          retention-days: 30

  lint-backend:
    name: Linting & Type Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: langchain_agent/requirements-dev.txt

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy types-requests

      - name: Run all lint and type checks
        id: lint
        run: |
          cd langchain_agent
          BLACK_STATUS="✅ Passed"; black --check . 2>&1 || BLACK_STATUS="❌ Failed"
          ISORT_STATUS="✅ Passed"; isort --check-only . 2>&1 || ISORT_STATUS="❌ Failed"
          FLAKE8_STATUS="✅ Passed"; flake8 . --count 2>&1 || FLAKE8_STATUS="❌ Failed"
          MYPY_STATUS="✅ Passed"; mypy main.py 2>&1 || MYPY_STATUS="❌ Failed"

          {
            echo "## Linting & Type Check Results"
            echo ""
            echo "| Tool | Status |"
            echo "|------|--------|"
            echo "| black (formatting) | $BLACK_STATUS |"
            echo "| isort (imports) | $ISORT_STATUS |"
            echo "| flake8 (style) | $FLAKE8_STATUS |"
            echo "| mypy (types) | $MYPY_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the step if any check failed
          LINT_FAILED=0
          [[ "$BLACK_STATUS" == *Failed* ]] && LINT_FAILED=1
          [[ "$ISORT_STATUS" == *Failed* ]] && LINT_FAILED=1
          [[ "$FLAKE8_STATUS" == *Failed* ]] && LINT_FAILED=1
          [[ "$MYPY_STATUS" == *Failed* ]] && LINT_FAILED=1
          exit $LINT_FAILED

  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: langchain_agent/web/package-lock.json

      - name: Install dependencies
        run: |
          cd langchain_agent/web
          npm ci

      - name: Run frontend tests
        run: |
          cd langchain_agent/web
          npm run test

      - name: Lint and type-check frontend
        run: |
          cd langchain_agent/web
          ESLINT_STATUS="✅ Passed"; npm run lint 2>&1 || ESLINT_STATUS="❌ Failed"
          TSC_STATUS="✅ Passed"; npx tsc --noEmit 2>&1 || TSC_STATUS="❌ Failed"

          {
            echo "## Frontend Lint & Type Check"
            echo ""
            echo "| Tool | Status |"
            echo "|------|--------|"
            echo "| ESLint | $ESLINT_STATUS |"
            echo "| TypeScript (tsc) | $TSC_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

          FE_FAILED=0
          [[ "$ESLINT_STATUS" == *Failed* ]] && FE_FAILED=1
          [[ "$TSC_STATUS" == *Failed* ]] && FE_FAILED=1
          exit $FE_FAILED

  shellcheck:
    name: ShellCheck & Workflow Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: |
          bash <(curl -sS https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/

      - name: Lint workflow files with actionlint
        # actionlint runs shellcheck on every `run:` block inside workflow YAML,
        # catching the class of bash -e / &&-chain bugs that hit us in production.
        run: actionlint .github/workflows/build-deploy.yml

      - name: ShellCheck scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './langchain_agent/scripts'
          severity: warning

      - name: Generate shellcheck summary
        if: always()
        run: |
          {
            echo "## ShellCheck & Workflow Lint"
            echo ""
            echo "Scanned: \`langchain_agent/scripts/*.sh\` and \`.github/workflows/*.yml\` (via actionlint)"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Workflow Status Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint-backend, frontend-tests, shellcheck]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          result_icon() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "🚫 Cancelled" ;;
              *) echo "❓ $1" ;;
            esac
          }

          UNIT_RESULT="${{ needs.unit-tests.result }}"
          INT_RESULT="${{ needs.integration-tests.result }}"
          LINT_RESULT="${{ needs.lint-backend.result }}"
          FRONTEND_RESULT="${{ needs.frontend-tests.result }}"
          SHELLCHECK_RESULT="${{ needs.shellcheck.result }}"

          {
            echo "## Workflow Summary — ${{ github.ref_name }} @ \`${{ github.sha }}\`"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Phase 1 — Unit Tests | $(result_icon $UNIT_RESULT) |"
            echo "| Phase 2 — Integration Tests | $(result_icon $INT_RESULT) |"
            echo "| Linting & Type Checks | $(result_icon $LINT_RESULT) |"
            echo "| Frontend Tests & Lint | $(result_icon $FRONTEND_RESULT) |"
            echo "| ShellCheck & Workflow Lint | $(result_icon $SHELLCHECK_RESULT) |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for r in $UNIT_RESULT $INT_RESULT $LINT_RESULT $FRONTEND_RESULT $SHELLCHECK_RESULT; do
            [ "$r" = "failure" ] && FAILED=1
          done

          [ $FAILED -eq 1 ] && exit 1
          echo "✅ All checks passed"
