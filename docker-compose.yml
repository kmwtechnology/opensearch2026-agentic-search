services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: langchain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langchain_agent}
      # postgres 18's image refuses to start with data directly at the
      # mount root (it expects a pg_ctlcluster-style version-specific
      # subdirectory) -- point PGDATA at a subdirectory of the volume mount.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    container_name: langchain-opensearch
    environment:
      - discovery.type=single-node
      # Security plugin is off for the local demo, so no admin password is
      # set or needed: the app and Lucille connect over plain http://localhost:9200
      # (OPENSEARCH_USER/OPENSEARCH_PASSWORD in langchain_agent/.env stay empty).
      - DISABLE_SECURITY_PLUGIN=true
      # 2g, up from 512m, for the ~158K-product corpus (#147): ~500 MB of
      # 768-dim vectors live off-heap in HNSW, but BM25 on 17x the docs, the
      # 8,956-query judgments index and bulk ingest all want more heap.
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # One-shot ingestion job, not a persistent service — gated behind the
  # "ingest" profile so `docker compose up -d` never starts it. Invoked by
  # scripts/lucille_ingest.sh via `docker compose run --rm lucille`, once for
  # products and once for judgments, with env vars set per invocation.
  # Always built locally from docker/lucille/Dockerfile — no CI/GHCR path.
  lucille:
    build:
      context: .
      dockerfile: docker/lucille/Dockerfile
      args:
        LUCILLE_VERSION: ${LUCILLE_VERSION:-0.11.1}
        # Docker Hub tag + digest, NOT the same as LUCILLE_VERSION above — see
        # the namespace note at the top of docker/lucille/Dockerfile. Digest
        # pins the exact image content so every local build uses the
        # identical base regardless of any future retag upstream. Keep both
        # defaults in sync with langchain_agent/.env.example.
        LUCILLE_DOCKER_TAG: ${LUCILLE_DOCKER_TAG:-0.11.1.0}
        LUCILLE_DOCKER_DIGEST: ${LUCILLE_DOCKER_DIGEST:-sha256:cefa9a3b2b9ed4c3cdf92da9abb93da37dc8ba392cc64ef39b81e02387f81073}
    container_name: langchain-lucille
    profiles: ["ingest"]
    environment:
      - LUCILLE_CONF
      - LUCILLE_OPTS
      - JAVA_OPTS
      - OPENSEARCH_URL
      - OPENSEARCH_INDEX
      - OPENSEARCH_VERIFY_CERTS
      - PARQUET_PATH
      - JUDGMENTS_PARQUET_PATH
    volumes:
      - ./langchain_agent/lucille-esci/conf:/lucille/conf:ro
      - ./data:/lucille/data:ro
      - ./langchain_agent/logs:/lucille/log
    depends_on:
      opensearch:
        condition: service_healthy

  # Fully-containerized backend + UI (built by langchain_agent/Dockerfile,
  # which bundles the compiled React frontend into the same FastAPI image --
  # one process, one origin, no separate frontend container). Gated behind
  # the "app" profile, like `lucille` is behind "ingest", so `docker compose
  # up -d` (native `make dev`'s Postgres+OpenSearch) never builds/starts
  # this by default. Use `make demo` (repo root: `docker compose --profile
  # app up -d --build`) for the fully-Dockerized path -- needs only Docker
  # and a native Ollama, no local Python/Node install. Ollama itself is
  # NEVER containerized: on macOS only a native install gets Metal GPU
  # access, and the 35B model is unusably slow on CPU.
  #
  # First-time data setup (creating the Postgres tables + OpenSearch index
  # and loading the product corpus) still requires a native `make setup`
  # once -- this service only runs the already-provisioned app.
  app:
    build:
      context: .
      dockerfile: langchain_agent/Dockerfile
    container_name: langchain-app
    profiles: ["app"]
    env_file:
      - langchain_agent/.env
    environment:
      # Override the native-dev defaults (langchain_agent/.env has
      # OPENSEARCH_HOST=localhost / POSTGRES_HOST=localhost, which don't
      # resolve from inside this container) with the compose service names.
      - OPENSEARCH_HOST=opensearch
      - POSTGRES_HOST=postgres
      # Ollama runs natively on the host, reached via Docker Desktop's host
      # alias (matches how scripts/lucille_ingest.sh reaches it).
      - OLLAMA_HOST=http://host.docker.internal:11434
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  opensearch_data:
    driver: local
