services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: langchain-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langchain_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
      args:
        OPENSEARCH_VERSION: "3.8.0"
        OPENSEARCH_DIGEST: "sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509"
    container_name: langchain-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongPassword123!
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0@sha256:ca28e40a095f7f03c5c02b4aa159fbf09638bc4b3af16f9d556bf6721a0783b1
    container_name: langchain-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"state\":\"green\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # One-shot ingestion job, not a persistent service — gated behind the
  # "ingest" profile so `docker compose up -d` never starts it. Invoked by
  # scripts/lucille_ingest.sh via `docker compose run --rm lucille`, once for
  # products and once for judgments, with env vars set per invocation.
  #
  # Two modes:
  #   1. Pre-built image (CI): LUCILLE_IMAGE env var points to a GHCR image,
  #      skip the build (compose uses the image as-is)
  #   2. Local dev: no LUCILLE_IMAGE, compose builds from docker/lucille/Dockerfile
  lucille:
    image: ${LUCILLE_IMAGE:-}
    build:
      context: .
      dockerfile: docker/lucille/Dockerfile
      args:
        LUCILLE_VERSION: ${LUCILLE_VERSION:-0.11.1}
        # Docker Hub tag + digest, NOT the same as LUCILLE_VERSION above — see
        # the namespace note at the top of docker/lucille/Dockerfile. Digest
        # pins the exact image content so local dev and GCP/CI build from the
        # identical base regardless of any future retag upstream. Keep both
        # defaults in sync with langchain_agent/.env.example.
        LUCILLE_DOCKER_TAG: ${LUCILLE_DOCKER_TAG:-0.11.1.0}
        LUCILLE_DOCKER_DIGEST: ${LUCILLE_DOCKER_DIGEST:-sha256:cefa9a3b2b9ed4c3cdf92da9abb93da37dc8ba392cc64ef39b81e02387f81073}
    container_name: langchain-lucille
    profiles: ["ingest"]
    environment:
      - LUCILLE_CONF
      - LUCILLE_OPTS
      - JAVA_OPTS
      - OPENSEARCH_URL
      - OPENSEARCH_INDEX
      - PARQUET_PATH
      - JUDGMENTS_PARQUET_PATH
    volumes:
      - ./langchain_agent/lucille-esci/conf:/lucille/conf:ro
      - ./data:/lucille/data:ro
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  opensearch_data:
    driver: local
