# Lucille ETL: ESCI Judgments → OpenSearch
#
# Reads the pre-aggregated judgments parquet (one row per query, ~97k rows).
# The parquet is produced by langchain_agent/scripts/prepare_judgments_parquet.py.
#
# Required env vars (set from langchain_agent/.env by lucille_ingest.sh):
#   OPENSEARCH_URL         e.g. http://localhost:9200
#   JUDGMENTS_PARQUET_PATH absolute path to esci_judgments_aggregated.parquet
#   OPENSEARCH_INDEX       the products index judgments get filtered against (see
#                          filterJudgmentsToProducts below) -- e.g. agentic_hybrid_search_docs

connectors: [
  {
    name: "esciJudgmentsConnector"
    class: "com.kmwllc.lucille.parquet.connector.ParquetConnector"
    pipeline: "judgmentsPipeline"

    pathToStorage: ${JUDGMENTS_PARQUET_PATH}
    fsUri: "file:///"
    idField: "query_id"
  }
]

pipelines: [
  {
    name: "judgmentsPipeline"
    stages: [
      # Expand the judgments_json column into the nested `judgments` field.
      # judgments_json contains {"judgments": [...array of {product_id, esci_label, relevance}...]}
      {
        name: "parseJudgments"
        class: "com.kmwllc.lucille.stage.ParseJson"
        src: "judgments_json"
        # No jsonFieldPaths → expand all top-level keys from the JSON object.
        # The JSON object has one key: "judgments", so this sets doc.judgments = ArrayNode.
        updateMode: "overwrite"
      }
      # Drop the raw JSON string column — it's now expanded into doc.judgments
      {
        name: "dropJsonString"
        class: "com.kmwllc.lucille.stage.DeleteFields"
        fields: ["judgments_json"]
      }
      # Drop internal pandas index if present
      {
        name: "dropInternalFields"
        class: "com.kmwllc.lucille.stage.DeleteFields"
        fields: ["__index_level_0__"]
      }
      # NOTE: RemoveEmptyFields is intentionally NOT used here. It calls
      # doc.getString(fieldName) on every field to test for emptiness, and
      # JsonNode.asText() on a non-scalar node (our `judgments` array) returns
      # "" -- so RemoveEmptyFields silently deleted the entire `judgments`
      # array on every document, leaving only the scalar `num_judgments`
      # count behind. Confirmed via lucille-core's RemoveEmptyFields.java
      # (StringUtils.isEmpty(doc.getString(fieldName))) and JsonDocument's
      # getString() (node.asText()). No stray empty scalar fields survive
      # this pipeline anyway (dropJsonString/dropInternalFields already
      # remove the only ones that existed), so this stage was never actually
      # doing useful cleanup here -- just removing it, not replacing it.

      # Trim each query's judgments down to only products actually present in
      # the products index, dropping queries left with none. Unfiltered, this
      # index references whatever product catalog the ESCI dataset covers --
      # far more than any given deployment (local dev's 10k sample included)
      # actually ingests -- leaving most judged queries useless downstream
      # (no retrievable judged product to score citation precision against).
      # MUST run after the products ingest (products index needs to exist and
      # be populated) -- lucille_ingest.sh already runs products before
      # judgments, so this holds for both local dev and GCP/CI.
      {
        name: "filterJudgmentsToProducts"
        class: "com.kmwllc.esci.FilterJudgmentsToProductsStage"
        openSearchUrl: ${OPENSEARCH_URL}
        productsIndex: ${OPENSEARCH_INDEX}
      }
    ]
  }
]

indexer {
  type: "OpenSearch"
  batchSize: 500
  batchTimeout: 5000
  sendEnabled: true
}

opensearch {
  url: ${OPENSEARCH_URL}
  index: "esci_judgments"
  acceptInvalidCert: true
}

worker {
  threads: 2
}

log {
  seconds: 15
}
