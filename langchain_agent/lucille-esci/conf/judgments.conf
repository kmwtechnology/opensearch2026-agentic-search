# Lucille ETL: ESCI Judgments → OpenSearch
#
# Reads the pre-aggregated judgments parquet (one row per query, ~97k rows).
# The parquet is produced by langchain_agent/scripts/prepare_judgments_parquet.py.
#
# Required env vars (set from langchain_agent/.env by lucille_ingest.sh):
#   OPENSEARCH_URL         e.g. http://localhost:9200
#   JUDGMENTS_PARQUET_PATH absolute path to esci_judgments_aggregated.parquet

connectors: [
  {
    name: "esciJudgmentsConnector"
    class: "com.kmwllc.lucille.parquet.connector.ParquetConnector"
    pipeline: "judgmentsPipeline"

    pathToStorage: ${JUDGMENTS_PARQUET_PATH}
    fsUri: "file:///"
    idField: "query_id"
  }
]

pipelines: [
  {
    name: "judgmentsPipeline"
    stages: [
      # Expand the judgments_json column into the nested `judgments` field.
      # judgments_json contains {"judgments": [...array of {product_id, esci_label, relevance}...]}
      {
        name: "parseJudgments"
        class: "com.kmwllc.lucille.stage.ParseJson"
        src: "judgments_json"
        # No jsonFieldPaths → expand all top-level keys from the JSON object.
        # The JSON object has one key: "judgments", so this sets doc.judgments = ArrayNode.
        updateMode: "overwrite"
      }
      # Drop the raw JSON string column — it's now expanded into doc.judgments
      {
        name: "dropJsonString"
        class: "com.kmwllc.lucille.stage.DeleteFields"
        fields: ["judgments_json"]
      }
      # Drop internal pandas index if present
      {
        name: "dropInternalFields"
        class: "com.kmwllc.lucille.stage.DeleteFields"
        fields: ["__index_level_0__"]
      }
      {
        name: "removeEmptyFields"
        class: "com.kmwllc.lucille.stage.RemoveEmptyFields"
      }
    ]
  }
]

indexer {
  type: "OpenSearch"
  batchSize: 500
  batchTimeout: 5000
  sendEnabled: true
}

opensearch {
  url: ${OPENSEARCH_URL}
  index: "esci_judgments"
  acceptInvalidCert: true
}

worker {
  threads: 2
}

log {
  seconds: 15
}
