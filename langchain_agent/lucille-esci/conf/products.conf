# Lucille ETL: ESCI Products → OpenSearch
#
# Reads the precomputed 10k parquet sample (embeddings already baked in as 768-dim doubles).
# No embedding API calls are made during this ingest.
#
# Required env vars (set from langchain_agent/.env by lucille_ingest.sh):
#   OPENSEARCH_URL   e.g. http://localhost:9200
#   OPENSEARCH_INDEX e.g. agentic_hybrid_search_docs
#   PARQUET_PATH     absolute path to esci_products_sample_10000.parquet

connectors: [
  {
    name: "esciProductsConnector"
    class: "com.kmwllc.lucille.parquet.connector.ParquetConnector"
    pipeline: "productsPipeline"

    pathToStorage: ${PARQUET_PATH}
    fsUri: "file:///"
    idField: "product_id"
  }
]

pipelines: [
  {
    name: "productsPipeline"
    stages: [
      # Build chunk_text: concatenate title + description + bullet_point (mirrors ingest_esci_products.py)
      {
        name: "buildChunkText"
        class: "com.kmwllc.lucille.stage.Concatenate"
        dest: "chunk_text"
        formatString: "{product_title} {product_description} {product_bullet_point}"
        updateMode: "overwrite"
      }
      # Copy product_title → title (used by the search pipeline).
      {
        name: "copyTitle"
        class: "com.kmwllc.lucille.stage.CopyFields"
        fieldMapping: {
          "product_title": "title"
        }
        updateMode: "overwrite"
      }
      # Copy product_title → title_suggest and product_brand → brand_suggest.
      # These fields use the edge-ngram autocomplete_analyzer and are queried
      # exclusively by /api/suggest. Without them the typeahead returns zero results.
      {
        name: "copySuggestFields"
        class: "com.kmwllc.lucille.stage.CopyFields"
        fieldMapping: {
          "product_title": "title_suggest"
          "product_brand": "brand_suggest"
        }
        updateMode: "overwrite"
      }
      # Drop internal pandas index and raw text fields that are already captured in chunk_text
      {
        name: "dropInternalFields"
        class: "com.kmwllc.lucille.stage.DeleteFields"
        fields: ["__index_level_0__"]
      }
      # Normalize product colors and brands using the custom AttributeNormalizerStage.
      # Inputs: product_color (raw string), product_brand (raw string)
      # Outputs:
      #   - product_color_primary: normalized primary color (16 canonical forms)
      #   - product_color_secondary: normalized secondary color (for multi-color products)
      #   - product_brand_normalized: normalized brand (lowercase + generic consolidation)
      #
      # Color lookup is sourced from the OpenSearch-backed attribute mapping
      # store (agentic_hybrid_search_attribute_mappings) so agent-driven
      # taxonomy growth (the live enrichment flywheel) is reflected in every
      # subsequent full reindex. Falls back to the bundled color_mappings.json
      # if the OpenSearch query fails (e.g. index not yet created).
      {
        name: "normalizeAttributes"
        class: "com.kmwllc.esci.AttributeNormalizerStage"
        openSearchUrl: ${OPENSEARCH_URL}
        colorMappingsPath: "/lucille/conf/color_mappings.json"
      }
      # Detect and normalize product material from unstructured text
      # (chunk_text, built above). Unlike color/brand there's no existing
      # product_material field to normalize — this stage scans for known
      # material variant terms and extracts+normalizes in one step.
      # Inputs: chunk_text (title + description + bullet_point)
      # Outputs:
      #   - product_material: raw matched text snippet (scored full-text field)
      #   - product_material_primary: normalized canonical material
      #   - product_material_secondary: second distinct material, if detected
      #
      # Material lookup is sourced from the OpenSearch-backed attribute
      # mapping store, seeded by scripts/seed_material_taxonomy.py and grown
      # live by the agent enrichment flywheel. No bundled-file fallback
      # exists for material (OS-native from the start) — if OpenSearch is
      # unreachable at start(), this stage produces no material fields for
      # that run rather than hard-failing ingestion.
      {
        name: "normalizeMaterial"
        class: "com.kmwllc.esci.MaterialNormalizerStage"
        openSearchUrl: ${OPENSEARCH_URL}
      }
      # Set collection_id required by the search API and health check
      # (mirrors the value written by OpenSearchVectorStore in ingest_esci_products.py)
      {
        name: "setCollectionId"
        class: "com.kmwllc.lucille.stage.SetStaticValues"
        staticValues: {
          "collection_id": "esci_products"
        }
        updateMode: "overwrite"
      }
      # Remove empty/null fields to avoid mapping conflicts
      {
        name: "removeEmptyFields"
        class: "com.kmwllc.lucille.stage.RemoveEmptyFields"
      }
    ]
  }
]

indexer {
  type: "OpenSearch"
  batchSize: 250
  batchTimeout: 5000
  sendEnabled: true
}

opensearch {
  url: ${OPENSEARCH_URL}
  index: ${OPENSEARCH_INDEX}
  acceptInvalidCert: true
}

worker {
  threads: 2
}

log {
  seconds: 15
}
