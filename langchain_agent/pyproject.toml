[tool.black]
line-length = 100
# Deliberately pinned to py313, NOT py314 (the runtime/CI version -- see #26).
# black 26.5.1's py314 target rewrites `except (ValueError, TypeError):` into
# invalid syntax `except ValueError, TypeError:`. Confirmed via
# `black --target-version py314 --check --diff main.py`. Bump this once that's
# fixed upstream; until then it's an intentional exception to the version-drift
# fix, not an oversight.
target-version = ["py313"]
extend-exclude = '''
(
    /(\.venv|venv|node_modules|build|dist|htmlcov|\.git)/
)
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "venv", "node_modules", "build", "dist", "htmlcov"]
skip_glob = ["**/node_modules/**"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = [
    "\\.venv/",
    "venv/",
    "node_modules/",
    "build/",
    "dist/",
    "htmlcov/",
    "tests/",
]
# Project is heavily Pydantic/LangChain; strict typing is not feasible.
# Run in permissive mode — catch egregious issues only.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "dict-item",
    "index",
    "misc",
    "operator",
    "truthy-function",
    "union-attr",
    "var-annotated",
]
