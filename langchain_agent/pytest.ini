[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# `e2e` and `slow` drive selection (scripts/smoke_local.sh runs -m "e2e and slow");
# the rest are labels.
markers =
    phase1: Phase 1 critical tests (validation, core error handling)
    unit: Unit tests
    integration: Integration tests (live Postgres/OpenSearch)
    e2e: End-to-end tests (live backend)
    slow: Tests that take > 1 second

timeout = 30
testpaths = tests

log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
